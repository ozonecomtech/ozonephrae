<!DOCTYPE html>
<html lang="th">
<head>

    <!-- Ozone Analytics Pixel -->
<script type="module" src="analytics.js"></script>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Phrae | Writing Experience</title>
    
    <!-- ฟอนต์ที่อ่านง่ายสไตล์เอกสาร -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'Kanit', 'sans-serif'],
                        display: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        forest: { 50: '#f2f7f2', 600: '#3a7d44', 700: '#2d5a27', 900: '#1a3a18' }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* สไตล์หน้ากระดาษ Word/Docs */
        .paper-page {
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            min-height: 80vh;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 80px;
            border-radius: 8px;
        }

        .input-plain {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            padding: 0 !important;
            background: transparent !important;
        }

        .sticky-toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid #eef2f6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        body.editor-active { overflow: hidden; }

        /* Animation */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-[#f3f4f6] font-sans text-slate-700">

    <!-- Dashboard Main View -->
    <div id="main-view" class="min-h-screen flex flex-col">
        <!-- Top Nav -->
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-10 sticky top-0 z-30 shadow-sm">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-leaf text-forest-600 text-3xl"></i>
                <span class="font-display font-bold text-2xl text-slate-800 uppercase tracking-tight">Ozone Admin</span>
            </div>

            <div id="api-status" class="text-sm font-bold uppercase text-slate-500 bg-slate-100 px-5 py-2 rounded-full border border-slate-200 shadow-inner">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Checking Status...
            </div>


            <div class="flex items-center gap-4">
            <a href="ozone_admin_dashboard.html" class="px-6 py-2 bg-slate-300 hover:bg-slate-200 text-slate-900 rounded-xl transition-all font-bold text-xs uppercase tracking-wider">กลับหน้า Dashboard</a>
            <div id="api-status" class="flex items-center gap-2 px-4 py-2 rounded-full bg-white text-slate-400 text-[20px] font-bold border border-slate-100 uppercase tracking-widest shadow-sm">
            </div>

        </header>

        <!-- List Content -->
        <main class="flex-1 p-8 md:p-14">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
                    <div>
                        <h1 class="text-4xl font-display font-bold text-slate-900">คลังบทความ</h1>
                        <p class="text-slate-500 text-base mt-2">จัดการเรื่องราว ข่าวสาร และรูปภาพประจำโอโซนแพร่</p>
                    </div>
                    <button onclick="prepareCreate()" class="bg-forest-700 hover:bg-forest-900 text-white font-bold py-4 px-8 rounded-2xl shadow-xl shadow-forest-700/20 transition-all flex items-center gap-3 active:scale-95 text-lg">
                        <i class="fa-solid fa-feather-pointed"></i> เขียนบทความใหม่
                    </button>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-md">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-500 text-sm font-bold uppercase tracking-widest border-b border-slate-200">
                            <tr>
                                <th class="py-6 px-10">หัวข้อบทความ</th>
                                <th class="py-6 px-10">หมวดหมู่</th>
                                <th class="py-6 px-10 text-right">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="post-list" class="divide-y divide-slate-100 text-base">
                            <tr><td colspan="3" class="p-20 text-center text-slate-400 italic text-lg"><i class="fa-solid fa-spinner fa-spin mr-3"></i>กำลังดึงข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 🌟 Document Editor Overlay 🌟 -->
    <div id="editor-overlay" class="fixed inset-0 z-50 bg-[#f3f4f6] hidden overflow-y-auto custom-scrollbar fade-in">
        
        <!-- Sticky Tool Bar -->
        <div class="sticky-toolbar px-10 py-5 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <button onclick="closeEditor()" class="text-slate-500 hover:text-slate-900 flex items-center gap-3 transition-all group">
                    <i class="fa-solid fa-chevron-left group-hover:-translate-x-1 transition-transform text-lg"></i>
                    <span class="text-base font-bold">ออกจากการเขียน</span>
                </button>
                <div class="h-8 w-[2px] bg-slate-300"></div>
                <h2 id="editor-mode-title" class="text-lg font-bold text-slate-500">Editor Mode</h2>
            </div>
            <div class="flex items-center gap-6">
                <span id="save-status" class="text-xs font-bold text-slate-400 uppercase">Draft</span>
                <button id="btn-save" onclick="savePost()" class="bg-forest-700 hover:bg-forest-900 text-white px-10 py-3 rounded-xl text-base font-bold shadow-lg shadow-forest-700/20 transition-all active:scale-95 flex items-center gap-3">
                    <i class="fa-solid fa-check"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>

        <div class="flex flex-col xl:flex-row gap-12 p-8 lg:p-12 max-w-[1600px] mx-auto">
            
            <!-- Central Paper Area -->
            <div class="flex-1 order-2 xl:order-1">
                <div class="paper-page">
                    <form id="post-form">
                        <input type="hidden" id="post-id">
                        
                        <!-- Title -->
                        <textarea id="post-title" required rows="1" oninput="autoExpand(this)"
                            class="input-plain w-full text-5xl font-display font-bold text-slate-900 placeholder-slate-300 resize-none mb-12 overflow-hidden min-h-[70px]"
                            placeholder="ระบุชื่อหัวข้อบทความ..."></textarea>
                        
                        <!-- Content -->
                        <textarea id="post-excerpt" required rows="25" oninput="autoExpand(this)"
                            class="input-plain w-full text-xl leading-loose text-slate-700 placeholder-slate-300 resize-none overflow-hidden min-h-[400px]"
                            placeholder="เริ่มเขียนบรรยายความประทับใจหรือเรื่องราวที่นี่..."></textarea>
                    </form>
                </div>
            </div>

            <!-- Settings Sidebar -->
            <div class="w-full xl:w-[400px] order-1 xl:order-2 space-y-8">
                
                <!-- Category & Info -->
                <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-md">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-6">ตั้งค่าบทความ</label>
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm font-bold text-slate-700 mb-3">เลือกหมวดหมู่</p>
                            <select id="post-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-5 py-4 text-base outline-none focus:ring-4 focus:ring-forest-600/10 focus:border-forest-600 transition-all cursor-pointer font-medium text-slate-700">
                                <option value="ท่องเที่ยว">ท่องเที่ยว</option>
                                <option value="คาเฟ่ & กาแฟ">คาเฟ่ & กาแฟ</option>
                                <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                                <option value="เกษตรอินทรีย์">เกษตรอินทรีย์</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Main Image URL & Preview -->
                <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-md">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-6">ภาพหน้าปกบทความ</label>
                    <div class="space-y-5">
                        <div class="aspect-video bg-slate-50 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center relative group shadow-inner">
                            <img id="main-preview" src="" class="w-full h-full object-cover hidden">
                            <i id="main-placeholder" class="fa-solid fa-image text-slate-300 text-5xl"></i>
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="text-xs text-white font-bold uppercase tracking-widest">Cover Preview</span>
                            </div>
                        </div>
                        <div class="relative">
                            <i class="fa-solid fa-link absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="url" id="post-image" oninput="updatePreview('post-image', 'main-preview', 'main-placeholder')"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-12 pr-5 py-4 text-sm outline-none focus:ring-4 focus:ring-forest-600/10 focus:border-forest-600 transition-all text-slate-700 font-medium" placeholder="วางลิงก์ URL รูปภาพหลัก...">
                        </div>
                    </div>
                </div>

                <!-- 🌟 Smart Multi-Gallery Management 🌟 -->
                <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-md">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-6">คลังรูปภาพประกอบ (Gallery)</label>
                    
                    <!-- Quick Add Input -->
                    <div class="relative mb-6">
                        <i class="fa-solid fa-link absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="quick-gallery-add" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-12 pr-5 py-4 text-sm outline-none focus:ring-4 focus:ring-forest-600/10 focus:border-forest-600 transition-all placeholder-slate-400 font-medium text-slate-700" 
                            placeholder="วางลิงก์ที่นี่ แล้วกด Enter ↵"
                            onkeydown="handleGalleryEnter(event)"
                            onpaste="handleGalleryPaste(event)">
                    </div>

                    <!-- Gallery Grid -->
                    <div id="gallery-container" class="grid grid-cols-2 gap-4">
                        <!-- Dynamic image cards will appear here -->
                    </div>
                    
                    <p class="text-xs font-medium text-slate-400 mt-6 text-center bg-slate-50 py-2 rounded-lg"><i class="fa-regular fa-lightbulb text-amber-500 mr-2"></i> ก๊อปปี้หลายลิงก์มาวางพร้อมกันได้</p>
                </div>

                <div class="text-center p-4">
                    <button onclick="deletePostUI()" id="btn-delete-current" class="text-sm font-bold text-red-400 hover:text-red-600 transition-colors uppercase tracking-widest hidden bg-red-50 hover:bg-red-100 px-6 py-3 rounded-full">
                        <i class="fa-solid fa-trash mr-2"></i> ลบบทความนี้
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Area -->
    <script>
        const API = 'api.php';
        let postsData = [];

        // 1. Core Data Sync
        async function fetchPosts() {
            const status = document.getElementById('api-status');
            try {
                const res = await fetch(API);
                const data = await res.json();
                
                if (data.status === 'error') throw new Error(data.message);

                // Normalizing Data for UI
                postsData = data.map(p => {
                    let gal = [];
                    try { 
                        gal = (typeof p.gallery === 'string') ? JSON.parse(p.gallery) : (p.gallery || []); 
                    } catch(e) { gal = []; }
                    return { ...p, gallery: gal };
                });

                renderTable();
                status.innerHTML = `<i class="fa-solid fa-cloud-check mr-2"></i> System Sync: Online`;
                status.classList.replace('text-slate-500', 'text-emerald-600');
                status.classList.replace('bg-slate-100', 'bg-emerald-50');
                status.classList.replace('border-slate-200', 'border-emerald-200');
            } catch (err) {
                console.error(err);
                status.innerHTML = `<i class="fa-solid fa-cloud-xmark mr-2"></i> System Sync: Error`;
                status.classList.replace('text-slate-500', 'text-red-600');
                status.classList.replace('bg-slate-100', 'bg-red-50');
                status.classList.replace('border-slate-200', 'border-red-200');
                document.getElementById('post-list').innerHTML = `<tr><td colspan="3" class="p-10 text-center text-red-500 text-lg font-medium">Database Offline หรือไม่สามารถเชื่อมต่อ API ได้</td></tr>`;
            }
        }

        function renderTable() {
            const list = document.getElementById('post-list');
            if (postsData.length === 0) {
                list.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-slate-400 italic text-lg">ยังไม่มีข้อมูลบทความในระบบ</td></tr>';
                return;
            }

            list.innerHTML = postsData.map(p => `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td class="py-6 px-10 border-b border-slate-100">
                        <div class="flex items-center gap-6">
                            <div class="w-20 h-14 rounded-xl overflow-hidden shadow-sm border border-slate-200 bg-slate-100 shrink-0">
                                <img src="${p.image_url}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                            </div>
                            <div class="max-w-[500px]">
                                <p class="font-bold text-slate-800 line-clamp-1 text-lg tracking-tight mb-1">${p.title}</p>
                                <p class="text-xs text-slate-500 font-medium uppercase">ID #${p.id} • ${new Date(p.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                            </div>
                        </div>
                    </td>
                    <td class="py-6 px-10 border-b border-slate-100">
                        <span class="text-xs font-bold text-forest-700 bg-forest-50 px-4 py-2 rounded-full border border-forest-100 uppercase">${p.category}</span>
                    </td>
                    <td class="py-6 px-10 text-right border-b border-slate-100">
                        <div class="flex justify-end gap-3">
                            <button onclick="editPost(${p.id})" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all shadow-sm"><i class="fa-solid fa-pen-nib text-base"></i></button>
                            <button onclick="deletePost(${p.id})" class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all shadow-sm"><i class="fa-solid fa-trash-can text-base"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 2. Editor Mechanics
        function autoExpand(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function updatePreview(inputId, imgId, placeholderId) {
            const url = document.getElementById(inputId).value;
            const img = document.getElementById(imgId);
            const placeholder = document.getElementById(placeholderId);
            if (url && url.trim() !== "") {
                img.src = url;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        // 🌟 Smart Gallery System 🌟
        function handleGalleryEnter(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // ป้องกันฟอร์ม submit
                const val = e.target.value.trim();
                if (val) {
                    addGalleryInput(val);
                    e.target.value = '';
                }
            }
        }

        function handleGalleryPaste(e) {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text');
            if (pasteData) {
                // ค้นหาลิงก์ทั้งหมดที่ถูกคั่นด้วยการขึ้นบรรทัดใหม่หรือเว้นวรรค
                const urls = pasteData.split(/\r?\n|\s+/).map(u => u.trim()).filter(u => u.startsWith('http'));
                if (urls.length > 1) {
                    e.preventDefault(); // ดักจับไม่ให้วางข้อความทั้งหมดลงช่องเดียว
                    urls.forEach(u => addGalleryInput(u));
                    e.target.value = '';
                }
            }
        }

        function addGalleryInput(url = "") {
            if (!url) return;
            const container = document.getElementById('gallery-container');
            const div = document.createElement('div');
            div.className = "relative group aspect-square rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 shadow-sm animate-in fade-in";
            div.innerHTML = `
                <img src="${url}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=Error'">
                <input type="hidden" class="gallery-input" value="${url}">
                <!-- Overlay Actions -->
                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3 backdrop-blur-[2px]">
                    <button type="button" onclick="editGalleryItem(this)" class="w-10 h-10 rounded-full bg-white text-blue-600 flex items-center justify-center hover:scale-110 transition-transform shadow-lg" title="แก้ไขลิงก์"><i class="fa-solid fa-pen text-sm"></i></button>
                    <button type="button" onclick="this.closest('.group').remove()" class="w-10 h-10 rounded-full bg-white text-red-600 flex items-center justify-center hover:scale-110 transition-transform shadow-lg" title="ลบรูปนี้"><i class="fa-solid fa-trash text-sm"></i></button>
                </div>
            `;
            container.appendChild(div);
        }

        function editGalleryItem(btn) {
            const div = btn.closest('.group');
            const input = div.querySelector('.gallery-input');
            const img = div.querySelector('img');
            const newUrl = prompt("แก้ไขลิงก์รูปภาพ:", input.value);
            if (newUrl !== null && newUrl.trim() !== "") {
                input.value = newUrl.trim();
                img.src = newUrl.trim();
            }
        }

        // 3. UI Flow
        function openEditor() {
            document.getElementById('editor-overlay').classList.remove('hidden');
            document.body.classList.add('editor-active');
        }

        function closeEditor() {
            document.getElementById('editor-overlay').classList.add('hidden');
            document.body.classList.remove('editor-active');
        }

        function prepareCreate() {
            document.getElementById('post-form').reset();
            document.getElementById('gallery-container').innerHTML = '';
            document.getElementById('post-id').value = '';
            document.getElementById('btn-delete-current').classList.add('hidden');
            
            document.getElementById('editor-mode-title').innerText = 'เขียนบทความใหม่';
            document.getElementById('save-status').innerText = 'New Draft';
            
            openEditor(); // เปิดหน้าต่างก่อน เพื่อให้ Textarea มีขนาด (scrollHeight) ที่ถูกต้อง
            
            // UI Reset
            autoExpand(document.getElementById('post-title'));
            autoExpand(document.getElementById('post-excerpt'));
            updatePreview('post-image', 'main-preview', 'main-placeholder');
            document.getElementById('quick-gallery-add').value = '';
        }

        function editPost(id) {
            const p = postsData.find(x => x.id == id);
            if (!p) return;

            document.getElementById('post-id').value = p.id;
            document.getElementById('post-title').value = p.title || '';
            document.getElementById('post-category').value = p.category || 'ท่องเที่ยว';
            document.getElementById('post-image').value = p.image_url || '';
            document.getElementById('post-excerpt').value = p.excerpt || '';
            document.getElementById('quick-gallery-add').value = '';
            
            updatePreview('post-image', 'main-preview', 'main-placeholder');

            document.getElementById('gallery-container').innerHTML = '';
            if (p.gallery && Array.isArray(p.gallery)) {
                p.gallery.forEach(u => addGalleryInput(u));
            }

            document.getElementById('editor-mode-title').innerText = 'กำลังแก้ไข: บทความ #' + p.id;
            document.getElementById('save-status').innerText = 'Saved';
            document.getElementById('btn-delete-current').classList.remove('hidden');
            
            openEditor(); // เปิดหน้าต่างก่อน เพื่อให้การคำนวณความสูงทำงานได้ปกติ

            // Sync Heights
            autoExpand(document.getElementById('post-title'));
            autoExpand(document.getElementById('post-excerpt'));
        }

        // 4. API Actions
        async function savePost() {
            const btn = document.getElementById('btn-save');
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('post-title').value;
            const excerpt = document.getElementById('post-excerpt').value;

            if(!title.trim()) { alert("กรุณาระบุชื่อเรื่องให้ชัดเจน"); return; }

            const gallery = Array.from(document.querySelectorAll('.gallery-input')).map(i => i.value).filter(v => v.trim() !== "");

            const payload = {
                id: id || null,
                title: title,
                category: document.getElementById('post-category').value,
                image_url: document.getElementById('post-image').value,
                excerpt: excerpt,
                gallery: gallery
            };

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

                const response = await fetch(API, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === 'success') {
                    closeEditor();
                    fetchPosts();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("การบันทึกข้อมูลล้มเหลว โปรดตรวจสอบการเชื่อมต่อ");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> บันทึกข้อมูล';
            }
        }

        async function deletePost(id) {
            if (!confirm("คุณมั่นใจหรือไม่ที่ต้องการลบบทความชิ้นนี้? (ข้อมูลจะไม่สามารถกู้คืนได้)")) return;
            try {
                await fetch(`${API}?id=${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({id}) });
                fetchPosts();
            } catch (err) { alert("ลบข้อมูลไม่สำเร็จ"); }
        }

        function deletePostUI() {
            const id = document.getElementById('post-id').value;
            if(id) deletePost(id).then(() => closeEditor());
        }

        window.onload = fetchPosts;
    </script>
</body>
</html>
