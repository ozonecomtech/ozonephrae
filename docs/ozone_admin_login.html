<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ozone Phrae</title>
    
    <!-- Professional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Kanit', 'sans-serif'], 
                        heading: ['Prompt', 'sans-serif'] 
                    },
                    colors: { 
                        forest: { 
                            50: '#f0fdf4', 
                            600: '#16a34a', 
                            700: '#15803d', 
                            800: '#166534',
                            900: '#14532d' 
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            @apply rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)];
        }

        .input-group { @apply relative mb-5; }
        
        .input-field { 
            @apply w-full bg-slate-50 border border-slate-200 rounded-2xl pl-14 pr-6 py-4 outline-none focus:bg-white focus:border-forest-600 focus:ring-8 focus:ring-forest-600/5 transition-all font-medium text-slate-700; 
        }
        
        .input-icon { @apply absolute left-6 top-1/2 -translate-y-1/2 text-slate-400 text-lg transition-colors; }
        
        .btn-login {
            @apply w-full bg-forest-700 hover:bg-forest-900 text-white font-bold py-4.5 rounded-2xl shadow-xl shadow-forest-900/20 transition-all active:scale-95 flex justify-center items-center gap-3 uppercase tracking-[0.2em] text-sm;
            padding: 1.125rem;
        }

        @keyframes float { 
            0%, 100% { transform: translateY(0px) rotate(3deg); } 
            50% { transform: translateY(-10px) rotate(0deg); } 
        }
        .logo-animation { animation: float 5s ease-in-out infinite; }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-lg p-10 md:p-14 fade-in">
        <!-- Brand & Header -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-forest-700 rounded-3xl flex items-center justify-center text-white text-3xl shadow-2xl shadow-forest-900/30 mx-auto mb-6 logo-animation">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="text-3xl font-heading font-black text-slate-900 tracking-tight">OZONE <span class="text-forest-600">ADMIN</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-3 bg-slate-100 inline-block px-4 py-1.5 rounded-full">Secure Management Access</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-2">
            <div class="input-group group">
                <i class="fa-solid fa-user-shield input-icon group-focus-within:text-forest-600"></i>
                <input type="text" id="username" required 
                       class="input-field" 
                       placeholder="Username / Email">
            </div>

            <div class="input-group group">
                <i class="fa-solid fa-key input-icon group-focus-within:text-forest-600"></i>
                <input type="password" id="password" required 
                       class="input-field" 
                       placeholder="Password">
                <button type="button" onclick="togglePassword()" class="absolute right-6 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-600 transition-colors">
                    <i id="eye-icon" class="fa-solid fa-eye"></i>
                </button>
            </div>

            <div class="flex items-center justify-between px-2 mb-8">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative flex items-center">
                        <input type="checkbox" class="peer h-5 w-5 cursor-pointer appearance-none rounded-lg border border-slate-300 checked:bg-forest-600 checked:border-forest-600 transition-all">
                        <i class="fa-solid fa-check absolute text-[10px] text-white opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-400 group-hover:text-slate-600 transition-colors uppercase tracking-widest">Remember Me</span>
                </label>
                <a href="#" class="text-xs font-bold text-forest-600 hover:text-forest-800 uppercase tracking-widest transition-colors">Forgot?</a>
            </div>

            <button type="submit" id="login-btn" class="btn-login">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </form>

        <!-- Back to Website -->
        <div class="mt-12 text-center">
            <a href="ozone_phrae_live.html" class="inline-flex items-center gap-3 text-[10px] font-bold text-slate-400 hover:text-slate-900 transition-all uppercase tracking-widest group">
                <i class="fa-solid fa-circle-chevron-left group-hover:-translate-x-1 transition-transform"></i> 
                Back to main website
            </a>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] translate-y-20 opacity-0 transition-all duration-500 bg-slate-900 text-white px-8 py-4 rounded-[2rem] shadow-2xl flex items-center gap-4 border border-white/10 pointer-events-none">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center bg-rose-500 text-white">
            <i class="fa-solid fa-shield-xmark"></i>
        </div>
        <p id="toast-msg" class="text-sm font-bold uppercase tracking-tight">Access Denied</p>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

            // Simulated Login Logic
            setTimeout(() => {
                if (user === 'admin' && pass === 'Ap2316087') {
                    localStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'ozone_admin_dashboard.html';
                } else {
                    showToast("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง");
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right-long"></i>';
                }
            }, 1200);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-20');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-20');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }
    </script>
</body>
</html>
